<!-- JavaScript Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxEqYLpD2NjelmB3z73neQXA096CuApC4YeG48DW1qmQHJWjaNVxvWgJ61HHfBb-esD/exec";

        let dbUsers = [];
        let dbCars = [];
        let dbShifts = [];
        
        // Restore session from sessionStorage automatically on load if available
        let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;

        window.onload = function() {
            fetchDatabase();
        };

        function fetchDatabase() {
            const banner = document.getElementById('status-banner');
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.users) {
                        dbUsers = data.users;
                        dbCars = data.cars || [];
                        dbShifts = data.shifts || [];
                        banner.textContent = "Connected to Google Sheets successfully!";
                        banner.className = "w-full text-center py-2 text-sm font-medium text-white bg-green-600";
                        setTimeout(() => banner.classList.add('hidden'), 3000);

                        // If user was already logged in, verify against fresh dbUsers and reload dashboard
                        if (currentUser) {
                            const verifiedUser = dbUsers.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
                            if (verifiedUser) {
                                currentUser = verifiedUser; // update with latest role/status
                                loadDashboard(currentUser);
                            }
                        }
                    } else {
                        throw new Error("Invalid database response structure.");
                    }
                })
                .catch(err => {
                    banner.textContent = "Failed to connect to cloud database.";
                    banner.className = "w-full text-center py-2 text-sm font-medium text-white bg-red-600";
                    console.error(err);
                });
        }

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorDiv = document.getElementById('login-error');

            const matchedUser = dbUsers.find(u => u.username.toLowerCase() === usernameInput.toLowerCase() && u.password === passwordInput);

            if (matchedUser) {
                if (matchedUser.status.toLowerCase() !== 'active') {
                    errorDiv.textContent = "Account is inactive. Contact Administrator.";
                    errorDiv.classList.remove('hidden');
                    return;
                }
                errorDiv.classList.add('hidden');
                currentUser = matchedUser;
                sessionStorage.setItem('currentUser', JSON.stringify(matchedUser));
                loadDashboard(matchedUser);
            } else {
                errorDiv.textContent = "Invalid username or password.";
                errorDiv.classList.remove('hidden');
            }
        }

        function loadDashboard(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-title').textContent = `Welcome, ${user.username}`;
            document.getElementById('user-role-display').textContent = `Role: ${user.role}`;

            const role = user.role.toLowerCase();
            const navTabs = document.getElementById('nav-tabs');
            navTabs.innerHTML = '';

            if (role === 'superadmin' || role === 'admin') {
                navTabs.innerHTML = `
                    <button onclick="switchTab('users')" id="tab-users-btn" class="px-4 py-2 rounded-lg font-medium text-sm bg-blue-600 text-white transition">User Management</button>
                    <button onclick="switchTab('cars')" id="tab-cars-btn" class="px-4 py-2 rounded-lg font-medium text-sm bg-gray-100 text-gray-700 hover:bg-gray-200 transition">Car Fleet</button>
                    <button onclick="switchTab('active-shifts')" id="tab-shifts-btn" class="px-4 py-2 rounded-lg font-medium text-sm bg-gray-100 text-gray-700 hover:bg-gray-200 transition">Live Shifts</button>
                `;
                document.getElementById('subtab-users').classList.remove('hidden');
                document.getElementById('subtab-cars').classList.add('hidden');
                document.getElementById('subtab-driver-portal').classList.add('hidden');
                document.getElementById('subtab-active-shifts').classList.add('hidden');
                renderUsersTable();
                renderCarsTable();
            } else {
                navTabs.innerHTML = `
                    <button onclick="switchTab('driver-portal')" id="tab-driver-portal-btn" class="px-4 py-2 rounded-lg font-medium text-sm bg-blue-600 text-white transition">My Shift & Expenses</button>
                `;
                document.getElementById('subtab-users').classList.add('hidden');
                document.getElementById('subtab-cars').classList.add('hidden');
                document.getElementById('subtab-active-shifts').classList.add('hidden');
                document.getElementById('subtab-driver-portal').classList.remove('hidden');
                renderDriverPortal(user.username);
            }
        }

        function switchTab(tab) {
            document.getElementById('subtab-users').classList.add('hidden');
            document.getElementById('subtab-cars').classList.add('hidden');
            document.getElementById('subtab-driver-portal').classList.add('hidden');
            document.getElementById('subtab-active-shifts').classList.add('hidden');

            ['tab-users-btn', 'tab-cars-btn', 'tab-shifts-btn'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "px-4 py-2 rounded-lg font-medium text-sm bg-gray-100 text-gray-700 hover:bg-gray-200 transition";
            });

            if (tab === 'users') {
                document.getElementById('subtab-users').classList.remove('hidden');
                document.getElementById('tab-users-btn').className = "px-4 py-2 rounded-lg font-medium text-sm bg-blue-600 text-white transition";
            } else if (tab === 'cars') {
                document.getElementById('subtab-cars').classList.remove('hidden');
                document.getElementById('tab-cars-btn').className = "px-4 py-2 rounded-lg font-medium text-sm bg-blue-600 text-white transition";
            } else if (tab === 'active-shifts') {
                document.getElementById('subtab-active-shifts').classList.remove('hidden');
                document.getElementById('tab-shifts-btn').className = "px-4 py-2 rounded-lg font-medium text-sm bg-blue-600 text-white transition";
                renderActiveShiftsTable();
            } else if (tab === 'driver-portal') {
                document.getElementById('subtab-driver-portal').classList.remove('hidden');
            }
        }

        function renderDriverPortal(username) {
            const activeShift = dbShifts.find(s => s.driver.toLowerCase() === username.toLowerCase() && s.status.toLowerCase() === 'active');
            const startView = document.getElementById('start-shift-view');
            const endView = document.getElementById('end-shift-view');
            const expenseContainer = document.getElementById('expense-container');

            if (activeShift) {
                startView.classList.add('hidden');
                endView.classList.remove('hidden');
                expenseContainer.classList.remove('hidden');
                document.getElementById('active-shift-info').textContent = `Currently logged in with Car: ${activeShift.regNumber}`;
            } else {
                startView.classList.remove('hidden');
                endView.classList.add('hidden');
                expenseContainer.classList.add('hidden');

                const activeCarsInUse = dbShifts.filter(s => s.status.toLowerCase() === 'active').map(s => s.regNumber);
                const availableCars = dbCars.filter(c => c.status.toLowerCase() === 'active' && !activeCarsInUse.includes(c.reg));

                const select = document.getElementById('active-car-select');
                if (availableCars.length === 0) {
                    select.innerHTML = `<option value="">No active cars available</option>`;
                } else {
                    select.innerHTML = availableCars.map(c => `<option value="${c.reg}">${c.reg} - ${c.desc} (${c.fuelType})</option>`).join('');
                }
            }
        }

        function handleStartShift(event) {
            event.preventDefault();
            const carReg = document.getElementById('active-car-select').value;
            const startOdo = document.getElementById('start-odo-reading').value;
            const now = new Date();

            if (!carReg) {
                alert("Please select a valid car.");
                return;
            }

            const payload = {
                action: "startShift",
                driver: currentUser.username,
                regNumber: carReg,
                date: now.toLocaleDateString(),
                startTime: now.toLocaleTimeString(),
                startTimestamp: now.toISOString(),
                startOdometer: startOdo,
                startSelfieUrl: "Uploaded_Selfie_Mock_URL",
                startOdoPhotoUrl: "Uploaded_Start_Odo_Mock_URL"
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        alert("Shift started successfully!");
                        fetchDatabase();
                    } else {
                        alert(res.message);
                    }
                })
                .catch(err => alert("Error: " + err.message));
        }

        function handleEndShift(event) {
            event.preventDefault();
            const endOdo = document.getElementById('end-odo-reading').value;
            const now = new Date();

            const payload = {
                action: "endShift",
                driver: currentUser.username,
                endTime: now.toLocaleTimeString(),
                endTimestamp: now.toISOString(),
                endOdometer: endOdo,
                endOdoPhotoUrl: "Uploaded_End_Odo_Mock_URL"
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        alert("Shift closed successfully!");
                        fetchDatabase();
                    } else {
                        alert(res.message);
                    }
                })
                .catch(err => alert("Error: " + err.message));
        }

        function handleCreateCar(event) {
            event.preventDefault();
            const reg = document.getElementById('car-reg').value.trim();
            const desc = document.getElementById('car-model').value.trim();
            const fuelType = document.getElementById('car-fuel').value;
            const status = document.getElementById('car-status').value;

            const payload = {
                action: "addCar",
                reg: reg,
                desc: desc,
                fuelType: fuelType,
                status: status,
                owner: currentUser ? currentUser.username : "Admin",
                leaseType: "Standard",
                leaseMonthly: 0,
                leaseStart: "",
                leaseEnd: ""
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        alert("Car registered successfully!");
                        document.getElementById('create-car-form').reset();
                        fetchDatabase();
                    } else {
                        alert("Error: " + res.message);
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
        }

        function handleCreateUser(event) {
            event.preventDefault();
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const role = document.getElementById('new-role').value;

            const payload = {
                action: "addUser",
                username: username,
                password: password,
                role: role,
                status: "Active"
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        alert("User created successfully!");
                        document.getElementById('create-user-form').reset();
                        fetchDatabase();
                    } else {
                        alert("Error: " + res.message);
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
        }

        function renderActiveShiftsTable() {
            const tbody = document.getElementById('active-shifts-table-body');
            const activeShifts = dbShifts.filter(s => s.status.toLowerCase() === 'active');

            if (activeShifts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No cars currently on active shift. All fleet vehicles are parked.</td></tr>`;
                return;
            }

            tbody.innerHTML = activeShifts.map(s => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-medium text-gray-900">${s.driver}</td>
                    <td class="p-3 font-semibold text-blue-600">${s.regNumber}</td>
                    <td class="p-3 text-gray-600">Active Duty</td>
                    <td class="p-3"><span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800 animate-pulse">Active On Shift</span></td>
                    <td class="p-3">
                        <button onclick="promptAdminForceClose('${s.driver}', '${s.regNumber}')" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded font-medium hover:bg-red-700 transition">
                            Force Close & Release Car
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function promptAdminForceClose(driverName, regNumber) {
            const closingOdo = prompt(`Force closing shift for driver: ${driverName} (${regNumber}).\n\nEnter Closing Odometer Reading (km):`);
            if (!closingOdo) return;

            const fineInput = prompt(`Select Close Type:\n1. Enter Fine Amount in ₹ (e.g., 500 for negligence)\n2. Enter 0 for Genuine Cause (Phone issue/emergency, No Fine):`, "0");
            const fineAmount = Number(fineInput) || 0;

            const now = new Date();
            const payload = {
                action: "adminCloseShift",
                driver: driverName,
                regNumber: regNumber,
                endTime: now.toLocaleTimeString(),
                endTimestamp: now.toISOString(),
                endOdometer: closingOdo,
                fine: fineAmount
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        alert(`Shift successfully closed by Admin! Vehicle ${regNumber} is now released.${fineAmount > 0 ? ' Fine of ₹' + fineAmount + ' recorded.' : ''}`);
                        fetchDatabase();
                    } else {
                        alert("Error: " + res.message);
                    }
                })
                .catch(err => alert("Connection error: " + err.message));
        }

        function handleLogExpense(event) {
            event.preventDefault();
            const activeShift = dbShifts.find(s => s.driver.toLowerCase() === currentUser.username.toLowerCase() && s.status.toLowerCase() === 'active');
            if (!activeShift) {
                alert("No active shift found!");
                return;
            }

            const category = document.getElementById('expense-category').value;
            const amount = document.getElementById('expense-amount').value;
            const msgDiv = document.getElementById('expense-msg');
            const now = new Date();

            const payload = {
                action: "logDriverExpense",
                driver: currentUser.username,
                regNumber: activeShift.regNumber,
                date: now.toLocaleDateString(),
                category: category,
                amount: amount,
                receiptUrl: "Uploaded_Receipt_Mock_URL",
                timestamp: now.toISOString()
            };

            msgDiv.textContent = "Logging expense...";
            msgDiv.className = "text-sm mt-2 text-blue-600";
            msgDiv.classList.remove('hidden');

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        msgDiv.textContent = "Expense logged and linked to vehicle successfully!";
                        msgDiv.className = "text-sm mt-2 text-green-600";
                        document.getElementById('expense-amount').value = '';
                        document.getElementById('expense-receipt').value = '';
                    } else {
                        throw new Error(res.message);
                    }
                })
                .catch(err => {
                    msgDiv.textContent = "Error: " + err.message;
                    msgDiv.className = "text-sm mt-2 text-red-600";
                });
        }

        function renderUsersTable() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = dbUsers.map(u => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-medium text-gray-900">${u.username}</td>
                    <td class="p-3 capitalize">${u.role}</td>
                    <td class="p-3"><span class="px-2 py-1 text-xs font-semibold rounded-full ${u.status.toLowerCase() === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${u.status}</span></td>
                </tr>
            `).join('');
        }

        function renderCarsTable() {
            const tbody = document.getElementById('cars-table-body');
            if (dbCars.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No cars registered yet.</td></tr>`;
                return;
            }
            tbody.innerHTML = dbCars.map(c => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-medium text-gray-900">${c.reg}</td>
                    <td class="p-3">${c.desc}</td>
                    <td class="p-3"><span class="px-2 py-1 text-xs font-semibold rounded bg-blue-50 text-blue-700">${c.fuelType}</span></td>
                    <td class="p-3"><span class="px-2 py-1 text-xs font-semibold rounded-full ${c.status.toLowerCase() === 'active' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">${c.status}</span></td>
                </tr>
            `).join('');
        }

        function handleLogout() {
            currentUser = null;
            sessionStorage.removeItem('currentUser');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-form').reset();
            fetchDatabase();
        }
    </script>
