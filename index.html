<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

    <!-- Status Banner -->
    <div id="status-banner" class="w-full text-center py-2 text-sm font-medium text-white bg-blue-600 transition-colors">
        Connecting to cloud database...
    </div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- LOGIN VIEW -->
        <div id="login-section" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Portal Login</h2>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Login ID / Username</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter password">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Login to Portal
                </button>
            </form>
            <div id="login-error" class="text-red-500 text-sm text-center mt-3 hidden"></div>
        </div>

        <!-- DASHBOARD VIEW (Hidden by default) -->
        <div id="dashboard-section" class="hidden bg-white p-8 rounded-xl shadow-md w-full max-w-4xl border border-gray-100">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h1 id="welcome-title" class="text-2xl font-bold text-gray-800">Dashboard</h1>
                    <p id="user-role-display" class="text-sm text-gray-500 uppercase tracking-wide"></p>
                </div>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">
                    Logout
                </button>
            </div>

            <!-- Management Panel: Create User (Visible to Superadmin & Admin) -->
            <div id="management-panel" class="hidden mb-8 bg-gray-50 p-6 rounded-lg border border-gray-200">
                <h3 id="panel-title" class="text-lg font-semibold text-gray-800 mb-4">Create New User</h3>
                <form id="create-user-form" onsubmit="handleCreateUser(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="new-username" placeholder="Username" required class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="new-password" placeholder="Password" required class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="new-role" class="px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <!-- Options will be filtered dynamically based on logged-in role -->
                    </select>
                    <button type="submit" class="bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
                        Add User
                    </button>
                </form>
                <div id="create-msg" class="text-sm mt-2 hidden"></div>
            </div>

            <!-- General Content Area -->
            <div class="text-gray-600">
                <p>Welcome to the Fleet Management System portal. Your session is active and securely connected to Google Sheets.</p>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
        Fleet Management System &copy; 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxEqYLpD2NjelmB3z73neQXA096CuApC4YeG48DW1qmQHJWjaNVxvWgJ61HHfBb-esD/exec";

        let dbUsers = [];

        window.onload = function() {
            fetchDatabase();
        };

        // Fetch users dynamically from Google Sheets via Apps Script
        function fetchDatabase() {
            const banner = document.getElementById('status-banner');
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.users) {
                        dbUsers = data.users;
                        banner.textContent = "Connected to Google Sheets successfully!";
                        banner.className = "w-full text-center py-2 text-sm font-medium text-white bg-green-600";
                        setTimeout(() => banner.classList.add('hidden'), 3000);
                    } else {
                        throw new Error("Invalid database response structure.");
                    }
                })
                .catch(err => {
                    banner.textContent = "Failed to connect to cloud database. Check internet connection.";
                    banner.className = "w-full text-center py-2 text-sm font-medium text-white bg-red-600";
                    console.error(err);
                });
        }

        // Handle Login Authentication against dynamic Sheet data
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorDiv = document.getElementById('login-error');

            const matchedUser = dbUsers.find(u => u.username.toLowerCase() === usernameInput.toLowerCase() && u.password === passwordInput);

            if (matchedUser) {
                if (matchedUser.status.toLowerCase() !== 'active') {
                    errorDiv.textContent = "Account is inactive. Contact Administrator.";
                    errorDiv.classList.remove('hidden');
                    return;
                }

                errorDiv.classList.add('hidden');
                sessionStorage.setItem('currentUser', JSON.stringify(matchedUser));
                loadDashboard(matchedUser);
            } else {
                errorDiv.textContent = "Invalid username or password.";
                errorDiv.classList.remove('hidden');
            }
        }

        // Load Dashboard based on Role
        function loadDashboard(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-title').textContent = `Welcome, ${user.username}`;
            document.getElementById('user-role-display').textContent = `Role: ${user.role}`;

            const managementPanel = document.getElementById('management-panel');
            const roleSelect = document.getElementById('new-role');
            const panelTitle = document.getElementById('panel-title');
            roleSelect.innerHTML = '';

            const userRole = user.role.toLowerCase();

            if (userRole === 'superadmin') {
                managementPanel.classList.remove('hidden');
                panelTitle.textContent = "Create New User (Admin / Driver)";
                roleSelect.innerHTML = `
                    <option value="admin">Admin</option>
                    <option value="driver">Driver</option>
                `;
            } else if (userRole === 'admin') {
                managementPanel.classList.remove('hidden');
                panelTitle.textContent = "Create New Driver";
                roleSelect.innerHTML = `
                    <option value="driver">Driver</option>
                `;
            } else {
                managementPanel.classList.add('hidden'); // Drivers see no creation panel
            }
        }

        // Handle creating a new user
        function handleCreateUser(event) {
            event.preventDefault();
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const role = document.getElementById('new-role').value;
            const msgDiv = document.getElementById('create-msg');

            const payload = {
                action: "addUser",
                username: username,
                password: password,
                role: role,
                status: "Active"
            };

            msgDiv.textContent = "Adding user to database...";
            msgDiv.className = "text-sm mt-2 text-blue-600";
            msgDiv.classList.remove('hidden');

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    msgDiv.textContent = "User created successfully!";
                    msgDiv.className = "text-sm mt-2 text-green-600";
                    document.getElementById('create-user-form').reset();
                    fetchDatabase(); // Refresh local user database array
                } else {
                    throw new Error(res.message);
                }
            })
            .catch(err => {
                msgDiv.textContent = "Error: " + err.message;
                msgDiv.className = "text-sm mt-2 text-red-600";
            });
        }

        function handleLogout() {
            sessionStorage.removeItem('currentUser');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-form').reset();
            fetchDatabase();
        }
    </script>
</body>
</html>
